name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.2', laravel: '6.*',  testbench: '4.*',  phpunit: '8.5.*' }
          - { php: '7.2', laravel: '7.*',  testbench: '5.*',  phpunit: '8.5.*' }
          - { php: '7.4', laravel: '7.*',  testbench: '5.*',  phpunit: '9.*' }
          - { php: '8.0', laravel: '8.*',  testbench: '6.*',  phpunit: '9.*' }
          - { php: '8.1', laravel: '9.*',  testbench: '7.*',  phpunit: '9.*' }
          - { php: '8.2', laravel: '10.*', testbench: '8.*',  phpunit: '10.*' }
          - { php: '8.3', laravel: '11.*', testbench: '9.*',  phpunit: '10.*' }
          - { php: '8.4', laravel: '12.*', testbench: '10.*', phpunit: '11.*' }
          - { php: '8.4', laravel: '13.*', testbench: '11.*', phpunit: '12.*' }

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      # The matrix installs old Laravel releases ON PURPOSE; recent Composer
      # would refuse them over their known security advisories. This only
      # changes the ephemeral CI checkout, never the shipped composer.json.
      - name: Allow historical framework versions
        run: composer config policy.advisories.block false

      - name: Pin the matrix versions
        run: >
          composer require
          "laravel/framework:${{ matrix.laravel }}"
          "orchestra/testbench:${{ matrix.testbench }}"
          "phpunit/phpunit:${{ matrix.phpunit }}"
          --dev --no-update --no-interaction

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      # Pint needs PHP 8.1+, so it is not in require-dev (the 7.x test legs
      # could not install it); the lint job installs it on its own.
      - name: Install Pint
        run: composer global require laravel/pint --no-interaction

      - name: Check code style
        run: |
          export PATH="$HOME/.composer/vendor/bin:$HOME/.config/composer/vendor/bin:$PATH"
          pint --test
